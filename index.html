<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.title">Pomodoro Timer</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <div class="app">
        <header class="header">
            <h1 class="header__title" data-i18n="app.name">Pomodoro</h1>
            <div class="header__actions">
                <button id="lang-btn" class="icon-btn icon-btn--lang" type="button" data-i18n-aria="header.langAria">
                    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                        <path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                    </svg>
                    <span class="icon-btn__code" data-lang-code>PT</span>
                </button>
                <button id="settings-btn" class="icon-btn" type="button" data-i18n-aria="header.settingsAria">
                    <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
                        <path fill="currentColor" d="M19.14 12.94c.04-.3.06-.61.06-.94s-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.62l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96a7.03 7.03 0 0 0-1.62-.94l-.36-2.54a.48.48 0 0 0-.48-.41h-3.84a.48.48 0 0 0-.48.41l-.36 2.54c-.58.24-1.12.55-1.62.94l-2.39-.96a.48.48 0 0 0-.59.22L2.74 8.87a.48.48 0 0 0 .12.62l2.03 1.58c-.05.3-.07.62-.07.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.62l1.92 3.32c.12.22.39.3.59.22l2.39-.96c.5.39 1.04.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.48-.41l.36-2.54c.58-.24 1.12-.55 1.62-.94l2.39.96c.2.08.47 0 .59-.22l1.92-3.32a.49.49 0 0 0-.12-.62l-2.03-1.58zM12 15.6A3.6 3.6 0 1 1 12 8.4a3.6 3.6 0 0 1 0 7.2z"/>
                    </svg>
                </button>
            </div>
        </header>

        <main class="main">
            <div class="tabs" role="tablist" aria-label="Tipo de sessão" data-i18n-aria="tabs.aria">
                <button class="tab is-active" type="button" role="tab" data-mode="focus" data-i18n="mode.focus">Foco</button>
                <button class="tab" type="button" role="tab" data-mode="short" data-i18n="mode.short">Pausa curta</button>
                <button class="tab" type="button" role="tab" data-mode="long" data-i18n="mode.long">Pausa longa</button>
            </div>

            <div class="timer">
                <svg class="timer__ring" viewBox="0 0 240 240" aria-hidden="true">
                    <circle class="ring__track" cx="120" cy="120" r="110"/>
                    <circle id="ring-progress" class="ring__progress" cx="120" cy="120" r="110"/>
                </svg>
                <div class="timer__content">
                    <div id="time-left" class="timer__time">25:00</div>
                    <div id="session-label" class="timer__label">Foco</div>
                </div>
            </div>

            <div class="controls">
                <button id="start-btn" class="btn btn--primary" type="button" data-i18n="btn.start">Iniciar</button>
                <button id="skip-btn" class="btn" type="button" data-i18n="btn.skip">Pular</button>
                <button id="reset-btn" class="btn" type="button" data-i18n="btn.reset">Reiniciar</button>
            </div>

            <p class="cycles"><span id="cycle-count">0</span> <span data-i18n="cycles.done">pomodoros concluídos</span></p>
        </main>

        <section class="radio">
            <button id="radio-toggle" class="radio__toggle" type="button" aria-expanded="false">
                <span class="radio__icon" aria-hidden="true">&#9835;</span>
                <span class="radio__name" data-i18n="radio.name">Rádio</span>
                <span id="radio-state" class="radio__state">toca pra abrir</span>
            </button>
            <div id="radio-player" class="radio__player" hidden>
                <label class="radio__field">
                    <span data-i18n="radio.station">Estação</span>
                    <select id="radio-station"></select>
                </label>
                <div id="radio-custom" class="radio__custom" hidden>
                    <input id="radio-custom-url" class="radio__input" type="url" placeholder="Cole um link do YouTube" data-i18n-placeholder="radio.customPlaceholder" autocomplete="off">
                    <button id="radio-custom-apply" class="btn" type="button" data-i18n="radio.play">Tocar</button>
                </div>
                <label id="radio-volume-row" class="radio__field" hidden>
                    <span data-i18n="radio.volume">Volume</span>
                    <input id="radio-volume" class="radio__range" type="range" min="0" max="100" step="1" value="60">
                </label>
                <div id="yt-player"></div>
                <div id="radio-fallback" class="radio__fallback" hidden></div>
            </div>
        </section>

        <footer class="footer">
            <p class="footer__text">
                <span data-i18n="footer.developedBy">Desenvolvido por</span> <a class="footer__link" href="https://github.com/rabisquim" target="_blank" rel="noopener">Robson Paulo</a>
            </p>
        </footer>
    </div>

    <div id="settings-modal" class="modal" hidden>
        <div class="modal__overlay" data-close></div>
        <div class="modal__box" role="dialog" aria-modal="true" aria-labelledby="settings-title">
            <h2 id="settings-title" class="modal__title" data-i18n="settings.title">Configurações</h2>

            <label class="field">
                <span data-i18n="settings.focus">Foco (min)</span>
                <input id="set-focus" type="number" min="1" max="120" step="1" value="25">
            </label>
            <label class="field">
                <span data-i18n="settings.short">Pausa curta (min)</span>
                <input id="set-short" type="number" min="1" max="60" step="1" value="5">
            </label>
            <label class="field">
                <span data-i18n="settings.long">Pausa longa (min)</span>
                <input id="set-long" type="number" min="1" max="60" step="1" value="15">
            </label>
            <label class="field">
                <span data-i18n="settings.cycles">Ciclos até pausa longa</span>
                <input id="set-cycles" type="number" min="1" max="12" step="1" value="4">
            </label>
            <label class="field field--row">
                <span data-i18n="settings.autoStart">Auto-iniciar próxima sessão</span>
                <input id="set-autostart" type="checkbox">
            </label>

            <div class="modal__actions">
                <button id="settings-cancel" class="btn" type="button" data-i18n="settings.cancel">Cancelar</button>
                <button id="settings-save" class="btn btn--primary" type="button" data-i18n="settings.save">Salvar</button>
            </div>
        </div>
    </div>

    <script src="https://www.youtube.com/iframe_api"></script>
    <script src="scripts/i18n.js"></script>
    <script src="scripts/script.js"></script>
</body>
</html>
